version: "3.9"

services:
  excel-lookup:
    build: .
    container_name: excel-lookup
    ports:
      - "6000:6000"
    volumes:
      # Mount a local data directory so you can hot-swap workbooks
      # without rebuilding the image.  Place your .xlsx here and
      # call GET /api/default or POST /api/upload from the UI.
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:6000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
